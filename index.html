<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語音辨識模型效能評測平台</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#17324e;background:#f2f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#071e42,#0b5bae);color:white;padding:24px max(18px,calc((100vw - 1180px)/2))}h1{margin:0;font-size:24px}header p{opacity:.85;margin:6px 0 0}main{max-width:1200px;margin:22px auto;padding:0 16px 50px}.card{background:white;border:1px solid #dce8f5;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 4px 15px #1234560a}h2{font-size:20px;color:#0b315c;margin:0 0 16px}.tag{font-size:12px;background:#eaf3ff;border:1px solid #c8dff6;padding:5px 8px;border-radius:6px;margin-right:9px}label{display:block;margin:10px 0}input[type=password],textarea,select{width:100%;border:1px solid #cbd9e8;border-radius:8px;padding:11px;font:inherit}textarea{min-height:115px}button{border:0;border-radius:9px;padding:11px 18px;background:#0755ac;color:white;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#eaf3ff;color:#0755ac}.muted{color:#697d97;font-size:13px}.layout{display:grid;grid-template-columns:1.12fr 1fr;gap:18px}.right .card{margin-bottom:18px}.model{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #dce8f5;border-radius:9px;margin:9px 0}.model input{width:18px;height:18px}.tt{background:#fff0e3}.breeze{background:#e8f6ff}.whisper{background:#fff}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9aa7b6;margin-right:6px}.connected{background:#23a55a}.error{background:#df6c41}.results{white-space:pre-wrap;background:#f8fbff;padding:14px;border-radius:9px;border:1px solid #dce8f5;margin:12px 0}.hide{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row label{display:inline-flex;gap:5px}.small{font-size:12px}.alert{color:#9a391e}.ok{color:#126e37}#login{max-width:470px;margin:45px auto}.model b{display:block}.model small{color:#61728b}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #dce8f5}#file{width:100%}@media(max-width:980px){.layout{display:block}.card{padding:17px}h1{font-size:21px}h2{font-size:18px}main{padding:0 12px 30px}}</style></head><body><header><h1>語音辨識模型效能評測平台</h1><p>ASR Model Benchmark｜內部測試環境</p></header><main><section id="login" class="card"><h2>測試包廂登入</h2><label>ROOM KEY <input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn">登入</button><p id="loginMsg" class="alert"></p></section><div id="app" class="hide"><div class="layout"><section class="card"><h2><span class="tag">STEP 1</span>API 連線管理與模型選擇</h2><p class="muted">最多選擇 3 個模型／API 組合，僅已接通的服務可辨識。</p><div id="modelOptions"></div><button id="refresh" class="secondary">重新檢查 API 連線</button><p id="apiMsg" class="muted"></p></section><div class="right"><section class="card"><h2><span class="tag">STEP 2</span>音訊資料上傳</h2><input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm"><p class="muted">建議 5 分鐘內、25 MB 以下音檔。</p><p id="fileInfo"></p></section><section class="card"><h2><span class="tag">STEP 3</span>語音辨識設定</h2><div class="row" id="languages"><label><input type="radio" name="language" value="auto" checked>自動偵測</label><label><input type="radio" name="language" value="zh">中文</label><label><input type="radio" name="language" value="en">英文</label><label><input type="radio" name="language" value="nan">台語</label><label><input type="radio" name="language" value="hak">客語</label></div><label>正確逐字稿（Ground Truth）<textarea id="truth" placeholder="先輸入正確逐字稿，辨識後再計算 CER / WER"></textarea></label><button id="start">開始辨識</button><p id="runMsg" class="muted"></p></section></div></div><section class="card"><h2><span class="tag">STEP 4</span>模型辨識結果確認</h2><div id="results"><p class="muted">尚未進行辨識。</p></div></section><section class="card"><h2><span class="tag">STEP 5</span>辨識效能評估及結果匯出</h2><button id="calculate" class="secondary">計算 CER / WER</button> <button id="export" class="secondary">匯出 CSV</button><p class="muted">CER：字元錯誤率；WER：詞彙錯誤率。以編輯距離除以正確逐字稿的字元／詞彙數計算。中文 WER 採空白分詞，僅供參考。</p><div id="scores"></div></section></div></main><script>
const $=id=>document.getElementById(id), choices=[{id:'tt',name:'Taiwan Tongues v1',model:'Taiwan-Tongues-ASR-CE',provider:'nchc',group:'tt',desc:'臺灣在地語音辨識模型'},{id:'b26',name:'Breeze ASR 26',model:'Breeze-ASR-26',provider:'nchc',group:'breeze',desc:'繁體中文語音辨識'},{id:'b25',name:'Breeze ASR 25',model:'whisper-Breeze-ASR-25',provider:'nchc',group:'breeze',desc:'Whisper 架構衍生模型'},{id:'w3g',name:'Whisper Large v3｜Groq',model:'whisper-large-v3',provider:'groq',group:'whisper',desc:'多語辨識／Groq API'},{id:'w3n',name:'Whisper Large v3｜NCHC',model:'Whisper-Large-V3',provider:'nchc',group:'whisper',desc:'多語辨識／國網中心'},{id:'wt',name:'Whisper v3 Turbo｜NCHC',model:'Whisper-Large-V3-Turbo',provider:'nchc',group:'whisper',desc:'較快推論／國網中心'}];let availability={},runs=[];async function req(url,opt){const r=await fetch(url,{credentials:'same-origin',...opt});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}async function login(){try{await req('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('login').classList.add('hide');$('app').classList.remove('hide');await status()}catch(e){$('loginMsg').textContent='登入失敗：'+e.message}}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};async function status(){let d;try{d=await req('/api/status')}catch(e){$('apiMsg').textContent='API 狀態查詢失敗：'+e.message;d={models:[]}}availability=Object.fromEntries((d.models||[]).map(m=>[m.id,m.status]));$('modelOptions').innerHTML=choices.map(c=>{let st=availability[c.provider==='groq'?'whisper-v3':c.model]||'unconfigured';let ok=st==='connected';return '<label class="model '+c.group+'"><input type="checkbox" value="'+c.id+'" '+(ok?'':'disabled')+'><span><b><i class="dot '+(ok?'connected':st==='error'?'error':'')+'"></i>'+c.name+'</b><small>'+c.desc+'｜'+(ok?'已連線':st==='unavailable'?'模型未提供':st==='limited'?'額度受限':st==='error'?'連線錯誤':'尚未接入')+'</small></span></label>'}).join('');$('modelOptions').querySelectorAll('input').forEach(i=>i.onchange=()=>{let sel=[...$('modelOptions').querySelectorAll('input:checked')];if(sel.length>3){i.checked=false;alert('最多選擇 3 個模型')}});$('apiMsg').textContent=d.note||''}$('refresh').onclick=status;$('file').onchange=()=>{$('fileInfo').textContent=$('file').files[0]?$('file').files[0].name+'（'+Math.round($('file').files[0].size/1024)+' KB）':''};$('start').onclick=async()=>{const file=$('file').files[0],selected=[...$('modelOptions').querySelectorAll('input:checked')].map(x=>choices.find(c=>c.id===x.value));if(!file)return alert('請先上傳音檔');if(!selected.length)return alert('請先選擇至少一個已連線模型');if(file.size>25*1024*1024)return alert('音檔超過 25MB');runs=[];$('scores').innerHTML='';$('results').innerHTML='';$('start').disabled=true;for(let j=0;j<selected.length;j++){let c=selected[j],t=performance.now();$('runMsg').textContent='辨識中 '+(j+1)+' / '+selected.length+'：'+c.name;try{let fd=new FormData();fd.append('file',file,file.name);fd.append('model',c.model);let lang=document.querySelector('input[name=language]:checked').value;if(lang!=='auto')fd.append('language',lang);let d=await req(c.provider==='groq'?'/api/transcribe':'/api/nchc-transcribe?model='+encodeURIComponent(c.model),{method:'POST',body:fd});runs.push({name:c.name,text:d.text||'',seconds:(performance.now()-t)/1000,error:''})}catch(e){runs.push({name:c.name,text:'',seconds:(performance.now()-t)/1000,error:e.message})}renderResults()}$('start').disabled=false;$('runMsg').textContent='辨識程序完成。請檢查結果，再按「計算 CER / WER」。'};function renderResults(){$('results').innerHTML=runs.map(r=>'<div class="results"><b>'+esc(r.name)+'</b>｜'+r.seconds.toFixed(2)+' 秒\n'+(r.error?'<span class="alert">'+esc(r.error)+'</span>':esc(r.text||'（無辨識文字）'))+'</div>').join('')}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function distance(a,b){let v=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let w=[i];for(let j=1;j<=b.length;j++)w[j]=Math.min(w[j-1]+1,v[j]+1,v[j-1]+(a[i-1]===b[j-1]?0:1));v=w}return v[b.length]}function chars(s){return [...s.replace(/\s/g,'')]}function words(s){return s.trim().split(/\s+/).filter(Boolean)}$('calculate').onclick=()=>{let truth=$('truth').value.trim();if(!truth)return alert('請先輸入正確逐字稿');if(!runs.length)return alert('請先執行辨識');let rows=runs.filter(r=>!r.error).map(r=>{let c=chars(truth),w=words(truth);r.cer=c.length?distance(c,chars(r.text))/c.length:null;r.wer=w.length?distance(w,words(r.text))/w.length:null;return '<tr><td>'+esc(r.name)+'</td><td>'+((r.cer??0)*100).toFixed(2)+'%</td><td>'+((r.wer??0)*100).toFixed(2)+'%</td><td>'+r.seconds.toFixed(2)+' 秒</td></tr>'});$('scores').innerHTML='<table><thead><tr><th>模型</th><th>CER</th><th>WER</th><th>辨識時間</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>'};$('export').onclick=()=>{if(!runs.length)return alert('尚無結果');let lines=[['模型','辨識時間(秒)','辨識結果','錯誤','CER','WER'],...runs.map(r=>[r.name,r.seconds.toFixed(2),r.text,r.error,r.cer??'',r.wer??''])];let csv='\uFEFF'+lines.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='asr-benchmark.csv';a.click();URL.revokeObjectURL(a.href)};(async()=>{try{let s=await req('/api/session');if(s.ok){$('login').classList.add('hide');$('app').classList.remove('hide');await status()}}catch(e){}})();
</script></body></html>
